<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sports Trials</title>

<link rel="stylesheet" href="style.css">

<style>

body{
    background:#f4f6f9;
}

.container{
    width:90%;
    max-width:1200px;
    margin:auto;
    padding:40px 0;
}

.page-title{
    text-align:center;
    color:#0b3d91;
    margin-bottom:30px;
}

.filters{
    display:flex;
    flex-wrap:wrap;
    gap:15px;
    justify-content:center;
    margin-bottom:30px;
}

.filters input,
.filters select{
    padding:12px;
    border-radius:8px;
    border:1px solid #ccc;
    min-width:220px;
}

.trial-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
    gap:25px;
}

.trial-card{
    background:#fff;
    border-radius:15px;
    overflow:hidden;
    box-shadow:0 10px 20px rgba(0,0,0,.08);
    transition:.3s;
}

.trial-card:hover{
    transform:translateY(-8px);
}

.trial-card img{
    width:100%;
    height:200px;
    object-fit:cover;
}

.content{
    padding:20px;
}

.content h3{
    color:#0b3d91;
    margin-bottom:10px;
}

.content p{
    margin:8px 0;
}

.status{
    display:inline-block;
    padding:6px 12px;
    background:green;
    color:#fff;
    border-radius:20px;
    font-size:14px;
}

button{
    margin-top:15px;
    width:100%;
    padding:12px;
    border:none;
    border-radius:8px;
    background:#0b3d91;
    color:#fff;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    background:#082b67;
}

</style>

</head>

<body>

<div class="container">

<h1 class="page-title">
Upcoming Sports Trials
</h1>

<div class="filters">

<input
type="text"
id="search"
placeholder="Search Sport">

<select id="filter">

<option value="All">All Sports</option>
<option>Football</option>
<option>Cricket</option>
<option>Badminton</option>
<option>Athletics</option>

</select>

</div>

<div class="trial-grid" id="trialGrid">

<div class="trial-card" data-sport="Football">

<img src="https://images.unsplash.com/photo-1517466787929-bc90951d0974?auto=format&fit=crop&w=900&q=80">

<div class="content">

<h3>Football Trial</h3>

<p>📍 Guwahati</p>

<p>📅 18 August 2026</p>

<span class="status">Open</span>

<button onclick="registerTrial('Football')">
Apply Now
</button>

</div>

</div>

<div class="trial-card" data-sport="Cricket">

<img src="https://images.unsplash.com/photo-1540747913346-19e32dc3e97e?auto=format&fit=crop&w=900&q=80">

<div class="content">

<h3>Cricket Trial</h3>

<p>📍 Dhubri</p>

<p>📅 25 August 2026</p>

<span class="status">Open</span>

<button onclick="registerTrial('Cricket')">
Apply Now
</button>

</div>

</div>

<div class="trial-card" data-sport="Badminton">

<img src="https://images.unsplash.com/photo-1626224583764-f87db24ac4b3?auto=format&fit=crop&w=900&q=80">

<div class="content">

<h3>Badminton Trial</h3>

<p>📍 Silchar</p>

<p>📅 28 August 2026</p>

<span class="status">Open</span>

<button onclick="registerTrial('Badminton')">
Apply Now
</button>

</div>

</div>

</div>

</div>

<script>

function registerTrial(sport){

alert("You selected " + sport + " Trial.");

window.location.href="register.html";

}

const search=document.getElementById("search");

const filter=document.getElementById("filter");

function filterCards(){

const text=search.value.toLowerCase();

const sport=filter.value;

document.querySelectorAll(".trial-card").forEach(card=>{

const name=card.dataset.sport.toLowerCase();

const matchText=name.includes(text);

const matchSport=sport==="All"||card.dataset.sport===sport;

card.style.display=(matchText&&matchSport)?"block":"none";

});

}

search.addEventListener("keyup",filterCards);

filter.addEventListener("change",filterCards);

</script>

</body>
</html>
